; Helion - build and flash with PlatformIO (https://platformio.org)
;   pio run                 build
;   pio run -t upload       build + flash through the ST-Link V2 (SWD)
;   pio device monitor      raw serial view (the USB-TTL adapter's port, 115200)
; PlatformIO downloads the compiler and the STM32Cube F1 HAL by itself.

[platformio]
src_dir     = Core/Src
include_dir = Core/Inc
default_envs = helion

[env:helion]
platform  = ststm32
board     = bluepill_f103c8
framework = stm32cube

; Linker script keeps the last 1 KB flash page free for the LDR calibration.
board_build.ldscript = STM32F103C8TX_FLASH.ld
board_upload.maximum_size = 64512

upload_protocol = stlink
; Clone Blue Pills (CKS32 / GD32 / "fake" STM32) report a different chip ID and the upload
; stops with "UNEXPECTED idcode". If you see that, remove the semicolon on the next line:
; upload_flags = -c set CPUTAPID 0x2ba01477
debug_tool      = stlink

monitor_speed   = 115200
monitor_filters = default

build_flags =
    -Wall
    -Wextra
    -Os

; Bare rig: 2 LDRs + 1 servo only, no INA219 modules (cardboard prototype).
;   pio run -e rig -t upload
[env:rig]
extends     = env:helion
build_flags =
    ${env:helion.build_flags}
    -DHAVE_INA219=0
